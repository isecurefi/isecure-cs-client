name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check scripts/qualify-gpgtest.mjs
      - run: python3 scripts/check-docs.py
      - run: bash scripts/generate.sh
      - run: git diff --exit-code -- src/ISECure.Client/Generated
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: node scripts/check-signing-example.mjs
      - run: dotnet test --no-build -c Release
      - run: dotnet pack src/ISECure.Client --no-build -c Release -o artifacts
